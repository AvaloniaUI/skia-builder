name: Build Skia

on:
  workflow_dispatch:
    inputs:
      skia:
        description: "Skia version: a milestone (158 builds the tip of chrome/m158), a branch, a tag or a full commit SHA"
        required: true
        default: "158"
      repository:
        description: "GitHub repository of Skia"
        required: true
        default: "google/skia"

permissions:
  contents: read

env:
  SKIA_BUILDER_REPOSITORY: ${{ inputs.repository }}

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      milestone: ${{ steps.version.outputs.milestone }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve ${{ inputs.skia }}
        id: version
        env:
          REF: ${{ inputs.skia }}
        run: python3 scripts/fetch-skia.py --repository "$SKIA_BUILDER_REPOSITORY" --ref "$REF" --resolve-only --github-output

      - name: Check that the release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Skia
        run: python3 scripts/fetch-skia.py --repository "$SKIA_BUILDER_REPOSITORY" --ref "${{ needs.resolve.outputs.sha }}" --os linux

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: docker/linux
          load: true
          tags: skia-builder-linux:${{ matrix.arch }}
          cache-from: type=gha,scope=linux-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=linux-${{ matrix.arch }}

      - name: Build
        env:
          SKIA_BUILDER_IMAGE: skia-builder-linux:${{ matrix.arch }}
        run: scripts/build-linux.sh ${{ matrix.arch }} --tag "${{ needs.resolve.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  windows:
    name: Windows ${{ matrix.arch }}
    needs: resolve
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Skia
        run: python scripts/fetch-skia.py --repository "$env:SKIA_BUILDER_REPOSITORY" --ref "${{ needs.resolve.outputs.sha }}" --os windows

      - name: Build
        run: python scripts/build.py windows ${{ matrix.arch }} --tag "${{ needs.resolve.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: release/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS ${{ matrix.arch }}
    needs: resolve
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Skia
        run: python scripts/fetch-skia.py --repository "$SKIA_BUILDER_REPOSITORY" --ref "${{ needs.resolve.outputs.sha }}" --os macos

      - name: Build
        run: python scripts/build.py macos ${{ matrix.arch }} --tag "${{ needs.resolve.outputs.tag }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Release
    needs: [resolve, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*64"
          path: release
          merge-multiple: true

      - name: Checksums and manifest
        env:
          REF: ${{ inputs.skia }}
        run: >
          python3 scripts/make-release.py release
          --tag "${{ needs.resolve.outputs.tag }}"
          --repository "$SKIA_BUILDER_REPOSITORY"
          --sha "${{ needs.resolve.outputs.sha }}"
          --milestone "${{ needs.resolve.outputs.milestone }}"
          --ref "$REF"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: >
          gh release create "$TAG" release/*.tar.gz release/SHA256SUMS release/manifest.json
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Skia $TAG" --notes-file release/release-notes.md
